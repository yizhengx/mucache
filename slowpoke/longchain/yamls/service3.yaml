kind: Service
apiVersion: v1
metadata:
  name: "service3"
  labels:
    app: "service3"
spec:
  selector:
    app: "service3"
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
    - protocol: TCP
      port: 5550
      targetPort: 5550
      name: zmq1
    - protocol: TCP
      port: 5551
      targetPort: 5551
      name: zmq2
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "service3"
  labels:
    app: "service3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "service3"
  template:
    metadata:
      labels:
        app: "service3"
    spec:
      containers:
        - name: "service3"
          image: sleepymug/slowpoke-longchain-microbench
          env:
            - name: APP_PORT
              value: "3000"
            - name: APP_NAME
              value: "servicex"
            - name: APP_NAME_NO_UNDERSCORES
              value: "service3"
            - name: APP_NAMESPACE
              value: "longchain"
            - name: CM_ENABLED
              value: "false"
            - name: EXPIRATION_TTL
              value: "0"
            - name: SLOWPOKE_SERV_NAME
              value: "service3"
            - name: SLOWPOKE_DELAY_MICROS
              value: "${SLOWPOKE_DELAY_MICROS_SERVICE3}"
            - name: SLOWPOKE_IS_TARGET_SERVICE
              value: "${SLOWPOKE_IS_TARGET_SERVICE_SERVICE3}"
            - name: SLOWPOKE_PRERUN
              value: "${SLOWPOKE_PRERUN}"
            - name: SLOWPOKE_PROCESSING_MICROS
              value: "${SLOWPOKE_PROCESSING_MICROS_SERVICE3}"
            - name: SLOWPOKE_POKER_BATCH_THRESHOLD
              value: "${SLOWPOKE_POKER_BATCH_THRESHOLD}"
            - name: LONGCHAIN_SERVICE_NUM
              value: "3"
          ports:
            - containerPort: 3000
            - containerPort: 5550
            - containerPort: 5551
          imagePullPolicy: Always

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker4
